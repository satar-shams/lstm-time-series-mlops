services:

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow

    working_dir: /mlflow

    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlflow/mlartifacts

    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --artifacts-destination file:///mlflow/mlartifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,mlflow,localhost:5000,localhost,127.0.0.1:5000,127.0.0.1

    ports:
      - "5000:5000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped



  trainer:

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      mlflow:
        condition: service_healthy

    environment:

      MLFLOW_TRACKING_URI: http://mlflow:5000

    command:
      python -m src.training.trainer

  api:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      mlflow:
        condition: service_healthy

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    ports:
      - "8000:8000"