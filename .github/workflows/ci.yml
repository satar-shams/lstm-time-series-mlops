name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
      - ci-cd-test

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.trainer.lock
          pip install -r requirements.api.lock
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          MODEL_SOURCE: local
        run: |
          python -m pytest tests/ -v \
          --ignore=tests/test_api.py \
          --ignore=tests/test_predictor_integration.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build local image for smoke testing
      - name: Build API image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: lstm-api:test

      - name: Run API container
        run: |
          docker run -d \
            --name lstm-api-test \
            -p 8000:8000 \
            -e MODEL_SOURCE=local \
            lstm-api:test

      - name: Wait for API startup
        run: |
          sleep 20

      - name: Test API health endpoint
        run: |
          curl --fail http://localhost:8000/api/v1/health

      - name: Test API prediction endpoint
        run: |
          curl --fail \
            -X POST http://localhost:8000/api/v1/predict \
            -H "Content-Type: application/json" \
            -d '{
              "data": [
                276.58, 283.92, 287.25, 287.18, 293.05,
                292.68, 294.80, 298.87, 298.21, 300.23,
                297.84, 298.97, 302.25, 304.99, 308.82,
                308.33, 310.85, 312.51, 312.06, 306.31,
                315.20, 310.26, 311.23, 307.34, 301.54,
                290.55, 291.58, 295.63, 291.13, 296.42
              ]
            }'

      - name: Stop API container
        if: always()
        run: |
          docker stop lstm-api-test
          docker rm lstm-api-test

      # Publish images only after tests pass
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lstm-api:latest
            ghcr.io/${{ github.repository_owner }}/lstm-api:${{ github.sha }}

      - name: Build and Push Trainer image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.trainer
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lstm-trainer:latest
            ghcr.io/${{ github.repository_owner }}/lstm-trainer:${{ github.sha }}

      - name: Build and Push MLflow image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mlflow
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lstm-mlflow:latest
            ghcr.io/${{ github.repository_owner }}/lstm-mlflow:${{ github.sha }}
